[project]
name = "goldsmc-service"
version = "1.0.0"
description = "News sentiment, economic calendar and neural directional model for the GoldSMC expert advisor"
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
