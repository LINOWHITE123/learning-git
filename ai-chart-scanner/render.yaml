services:
  - type: web
    name: ai-chart-scanner
    runtime: python
    rootDir: ai-chart-scanner
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: VISION_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
